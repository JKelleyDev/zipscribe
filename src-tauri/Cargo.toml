[package]
name = "zipscribe"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
cpal = "0.18.2"
dirs = "7.0.0"
enigo = "0.6.1"
env_logger = "0.11.11"
global-hotkey = "0.9.0"
log = "0.4.34"
thiserror = "1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"
whisper-rs = { version = "0.16.0", features = ["metal"] }
tauri-plugin-single-instance = "2"
block2 = "0.6"
objc2 = "0.6"
