[package]
edition = "2024"
rust-version = "1.95"
name = "mlxrs"
version = "0.2.0"
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Safe Rust bindings for Apple's MLX array framework, with LM, VLM, audio, and embeddings support"
homepage = "https://github.com/findit-studio/mlxrs"
documentation = "https://docs.rs/mlxrs"
readme = "README.md"
keywords = [
    "mlx",
    "apple-silicon",
    "machine-learning",
    "metal",
    "llm",
]
categories = [
    "science",
    "api-bindings",
    "external-ffi-bindings",
    "mathematics",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/findit-studio/mlxrs"

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
audio = [
    "lm",
    "dep:symphonia",
    "dep:cpal",
    "dep:unicode-normalization",
    "dep:xattr",
]
clap = [
    "embeddings",
    "audio",
    "npz",
    "dep:serde",
    "serde_json",
]
default = []
embeddinggemma = [
    "embeddings",
    "lm",
    "dep:serde",
    "serde_json",
]
embeddings = [
    "tokenizer",
    "dep:memspan",
    "dep:glob",
]
gguf = []
lfm2-vl = ["vlm"]
llguidance = [
    "lm",
    "dep:llguidance",
    "dep:toktrie_hf_tokenizers",
    "serde_json",
]
lm = [
    "tokenizer-config",
    "tokenizer-stream",
    "tokenizer-spm",
    "tokenizer-bpe",
    "tokenizer-chat",
    "tokenizer-deepseek-v32",
    "tokenizer-tools",
    "dep:regex",
]
npz = [
    "dep:zip",
    "dep:memmapix",
]
qwen3 = [
    "lm",
    "dep:serde",
    "serde_json",
]
qwen3-asr = [
    "qwen3",
    "audio",
    "dep:serde",
    "serde_json",
]
qwen3-asr-aligner = [
    "qwen3-asr",
    "tokenizer",
    "dep:unicode-general-category",
]
sensevoice = [
    "audio",
    "tokenizer-spm",
    "dep:serde",
    "serde_json",
]
serde_json = [
    "dep:serde_json",
    "dep:serde",
]
siglip2-naflex = [
    "embeddings",
    "vlm",
    "dep:serde",
    "serde_json",
]
tokenizer = ["dep:tokenizers"]
tokenizer-bpe = [
    "tokenizer-stream",
    "tokenizer-gpt2",
    "serde_json",
]
tokenizer-chat = [
    "tokenizer-config",
    "dep:minijinja",
    "dep:minijinja-contrib",
    "dep:serde",
    "dep:jiff",
]
tokenizer-config = [
    "tokenizer",
    "serde_json",
]
tokenizer-deepseek-v32 = ["tokenizer-chat"]
tokenizer-gpt2 = []
tokenizer-spm = [
    "tokenizer-stream",
    "serde_json",
]
tokenizer-stream = ["tokenizer"]
tokenizer-tools = [
    "tokenizer-config",
    "serde_json",
]
unstable-ops-overload = []
vad = [
    "audio",
    "dep:serde",
    "serde_json",
]
vlm = [
    "lm",
    "dep:image",
]
wav2vec2 = [
    "audio",
    "dep:serde",
    "serde_json",
]
whisper = [
    "audio",
    "tokenizer-bpe",
    "dep:flate2",
]

