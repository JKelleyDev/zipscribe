[dependencies.cpal]
version = "0.18"
optional = true

[dependencies.ctor]
version = "1"

[dependencies.derive_more]
version = "2"
features = [
    "display",
    "is_variant",
    "unwrap",
    "try_unwrap",
]
default-features = false

[dependencies.flate2]
version = "1"
optional = true

[dependencies.glob]
version = "0.3"
optional = true

[dependencies.half]
version = "2"

[dependencies.image]
version = "0.25"
features = [
    "png",
    "jpeg",
]
optional = true
default-features = false

[dependencies.jiff]
version = "0.2"
optional = true

[dependencies.libc]
version = "0.2"

[dependencies.llguidance]
version = "1.7"
features = [
    "lark",
    "referencing",
]
optional = true
default-features = false

[dependencies.memmapix]
version = "0.9"
optional = true

[dependencies.memspan]
version = "0.1"
optional = true

[dependencies.minijinja]
version = "2"
features = [
    "loader",
    "json",
    "loop_controls",
    "builtins",
    "preserve_order",
]
optional = true

[dependencies.minijinja-contrib]
version = "2"
features = ["pycompat"]
optional = true

[dependencies.mlxrs-sys]
version = "0.2"

[dependencies.regex]
version = "1"
features = [
    "std",
    "perf",
]
optional = true
default-features = false

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1"
features = ["preserve_order"]
optional = true

[dependencies.smallvec]
version = "1"

[dependencies.smol_str]
version = "0.3"

[dependencies.static_assertions]
version = "1"

[dependencies.symphonia]
version = "0.6"
features = [
    "wav",
    "pcm",
    "mp3",
    "flac",
    "ogg",
    "vorbis",
]
optional = true
default-features = false

[dependencies.thiserror]
version = "2"

[dependencies.tokenizers]
version = "0.23"
features = ["onig"]
optional = true
default-features = false

[dependencies.toktrie_hf_tokenizers]
version = "1.7"
optional = true

[dependencies.unicode-general-category]
version = "1"
optional = true

[dependencies.unicode-normalization]
version = "0.1"
optional = true

[dependencies.zip]
version = "8"
features = ["deflate"]
optional = true
default-features = false

[dev-dependencies.approx]
version = "0.5"

[dev-dependencies.criterion]
version = "0.8"

[dev-dependencies.libc]
version = "0.2"

[dev-dependencies.trybuild]
version = "1"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies.objc2]
version = "0.6"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies.objc2-core-ml]
version = "0.3"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies.objc2-foundation]
version = "0.3"
features = [
    "NSArray",
    "NSDictionary",
    "NSString",
    "NSValue",
    "NSError",
    "NSURL",
]

[target."cfg(unix)".dependencies.xattr]
version = "1"
optional = true

[lints.clippy]
large_types_passed_by_value = "deny"
map_clone = "deny"
needless_collect = "deny"
needless_pass_by_value = "deny"
redundant_allocation = "deny"
redundant_clone = "deny"
result_large_err = "allow"
undocumented_unsafe_blocks = "deny"
unnecessary_to_owned = "deny"
unnecessary_wraps = "deny"

[lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(all_tests)",
    "cfg(tarpaulin)",
    "cfg(mlxrs_force_scalar)",
]
