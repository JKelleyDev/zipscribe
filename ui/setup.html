<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to Zipscribe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page" id="page"></div>
<div class="bar-bottom">
  <button id="back">Back</button>
  <div class="dots" id="dots"></div>
  <button class="primary" id="next">Continue</button>
</div>
<script src="common.js"></script>
<script>
const STEPS = ["welcome", "mic", "access", "model", "cleanup", "hotkey"];
let step = 0;
let cfg;
let perms = { microphone: "not_determined", accessibility: false };
let speech = null;
let cleanupModels = [];
let cleanupDl = null; // {id, done, total} while downloading a clean-up model
let cleanupDlError = null;
let cleanupPrev = null; // model selected before an add, restored if the add fails
let dl = null; // {id, done, total} while downloading
let dlError = null;
let accessSkipped = false;
let pollTimer = null;

const page = $("#page");
$("#dots").innerHTML = STEPS.map(() => "<i></i>").join("");

function canContinue() {
  switch (STEPS[step]) {
    case "mic": return perms.microphone === "authorized";
    case "access": return perms.accessibility || accessSkipped;
    case "model": return !dl && speech?.installed;
    case "cleanup": return !cfg.cleanup_enabled || (!cleanupDl && cleanupModels.find((m) => m.id === cfg.cleanup_model)?.installed);
    default: return true;
  }
}

function render() {
  [...$("#dots").children].forEach((d, i) => d.classList.toggle("on", i <= step));
  $("#back").style.visibility = step === 0 ? "hidden" : "visible";
  const last = step === STEPS.length - 1;
  $("#next").textContent = last ? "Finish" : step === 0 ? "Get started" : "Continue";
  $("#next").disabled = !canContinue();
  views[STEPS[step]]();
}

const views = {
  welcome() {
    page.innerHTML = `
      <div class="hero">🎙</div>
      <h1>Welcome to Zipscribe</h1>
      <p class="muted">Hold a key, speak, let go — your words are typed into whatever app you're using.
      Everything runs on this Mac. Your voice never leaves it.</p>
      <p>This quick setup will:</p>
      <div class="card">
        <div class="row"><div class="label">1. Allow the microphone</div></div>
        <div class="row"><div class="label">2. Allow typing into other apps</div></div>
        <div class="row"><div class="label">3. Download the speech model</div></div>
        <div class="row"><div class="label">4. Set up optional text clean-up</div></div>
        <div class="row"><div class="label">5. Pick your hotkey and try it</div></div>
      </div>`;
  },

  mic() {
    const m = perms.microphone;
    const [txt, kind] = m === "authorized" ? ["Allowed", "ok"] : m === "denied" || m === "restricted" ? ["Blocked", "bad"] : ["Not yet asked", "warn"];
    page.innerHTML = `
      <h1>Microphone</h1>
      <p class="muted">Zipscribe records only while you hold the hotkey. Audio is processed on this Mac and is never uploaded.</p>
      <div class="card"><div class="row">
        <div class="label">Microphone access<small>${m === "denied" ? "Turn Zipscribe on in System Settings → Privacy & Security → Microphone." : "macOS will ask you to confirm."}</small></div>
        <span class="chip ${kind}">${txt}</span>
      </div></div>
      <p style="margin-top:14px">
        ${m === "not_determined" ? `<button class="primary" id="ask">Allow microphone</button>` : m === "authorized" ? "" : `<button class="primary" id="open">Open System Settings</button>`}
      </p>`;
    $("#ask")?.addEventListener("click", () => invoke("request_microphone"));
    $("#open")?.addEventListener("click", () => invoke("open_system_settings", { pane: "microphone" }));
  },

  access() {
    const ok = perms.accessibility;
    page.innerHTML = `
      <h1>Type into other apps</h1>
      <p class="muted">To type your words for you, macOS requires the <b>Accessibility</b> permission. Zipscribe uses it only to press keys.</p>
      <div class="card"><div class="row">
        <div class="label">Accessibility access<small>${ok ? "" : "Click the button, then switch Zipscribe on in the list that opens."}</small></div>
        <span class="chip ${ok ? "ok" : "warn"}">${ok ? "Allowed" : "Needed"}</span>
      </div></div>
      <p style="margin-top:14px">${ok ? "" : `<button class="primary" id="ask">Grant access</button> <button class="link" id="skip">Skip — copy text to the clipboard instead</button>`}</p>`;
    $("#ask")?.addEventListener("click", async () => { await invoke("request_accessibility"); });
    $("#skip")?.addEventListener("click", () => {
      accessSkipped = true;
      cfg.output_mode = "clipboard";
      render();
    });
  },

  model() {
    const cur = speech;
    page.innerHTML = `
      <h1>Speech model</h1>
      <p class="muted">The model turns your voice into text, on-device. It's free and a one-time download.</p>
      <div class="card"><div class="row">
        <div class="label">${cur.label}<small>${fmtMB(cur.size_mb)}</small></div>
        ${cur.installed ? `<span class="chip ok">Installed</span>` : ""}
      </div></div>
      <div id="dlbox" style="margin-top:14px">
        ${dl ? `<div class="bar"><div id="fill" style="width:${dl.total ? (100 * dl.done / dl.total).toFixed(1) : 0}%"></div></div>
          <div class="muted" id="dltext">Downloading… ${fmtBytes(dl.done)} of ${fmtBytes(dl.total)}</div>
          <p style="margin-top:8px"><button id="cancel">Cancel</button></p>`
        : cur?.installed ? "" : `<button class="primary" id="download">Download ${cur ? fmtMB(cur.size_mb) : ""}</button>`}
        ${dlError ? `<p style="color:var(--bad);margin-top:8px">${dlError}</p>` : ""}
      </div>`;
    $("#download")?.addEventListener("click", async () => {
      dlError = null;
      try { await invoke("download_model"); dl = { id: cur.id, done: 0, total: 0 }; }
      catch (e) { dlError = String(e); }
      render();
    });
    $("#cancel")?.addEventListener("click", () => invoke("cancel_download"));
  },

  cleanup() {
    const on = cfg.cleanup_enabled;
    const sel = cfg.cleanup_model;
    const cur = cleanupModels.find((m) => m.id === sel);
    const busy = !!cleanupDl;
    page.innerHTML = `
      <h1>Text clean-up</h1>
      <p class="muted">An optional small language model, running entirely on this Mac, removes "um"s and
      fixes punctuation before your words are typed. Nothing is sent over the internet.</p>
      <div class="card"><div class="row">
        <div class="label">Use AI clean-up<small>${on ? "Pick a model below." : "Off — Zipscribe will type a lightly tidied transcript instead."}</small></div>
        <label class="switch"><input type="checkbox" id="cu" ${on ? "checked" : ""}><span></span></label>
      </div></div>
      <div class="${on ? "" : "hidden"}">
        <h2>Model</h2>
        <p class="muted">Smaller is faster; bigger cleans up better. It's a one-time download.</p>
        <div class="card">
          ${cleanupModels.map((m) => `
            <label class="opt">
              <input type="radio" name="cm" value="${esc(m.id)}" ${m.id === sel ? "checked" : ""} ${busy ? "disabled" : ""}>
              <div class="grow"><b>${esc(m.label)}</b>
                ${m.is_default ? `<span class="chip">Recommended</span>` : ""}
                ${m.installed ? `<span class="chip ok">Installed</span>` : ""}
                <small>${fmtMB(m.size_mb)}${m.custom ? " · added from HuggingFace" : ""}</small></div>
            </label>`).join("")}
        </div>
        <div style="margin-top:14px">
          ${busy ? cleanupDlHtml()
            : cur && !cur.installed ? `<button class="primary" id="cinstall">Download ${fmtMB(cur.size_mb)}</button>` : ""}
          ${cleanupDlError ? `<p class="err">${esc(cleanupDlError)}</p>` : ""}
        </div>
        <h2>Use your own model</h2>
        <p class="muted">Paste a HuggingFace link or repo id for a Qwen3-based MLX model.</p>
        <div class="inline-add">
          <input type="text" id="hf" placeholder="mlx-community/Qwen3-8B-4bit" ${busy ? "disabled" : ""}>
          <button id="hfadd" ${busy ? "disabled" : ""}>Add</button>
        </div>
      </div>`;
    $("#cu").addEventListener("change", (e) => {
      cfg.cleanup_enabled = e.target.checked;
      render();
    });
    page.querySelectorAll("input[name=cm]").forEach((r) =>
      r.addEventListener("change", () => { cfg.cleanup_model = r.value; cleanupDlError = null; render(); }));
    $("#cinstall")?.addEventListener("click", () => installCleanup(sel));
    const add = () => {
      const v = $("#hf").value.trim();
      if (v) installCleanup(v);
    };
    $("#hfadd").addEventListener("click", add);
    $("#hf").addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
    if (busy) $("#ccancel")?.addEventListener("click", () => invoke("cancel_download"));
  },

  hotkey() {
    page.innerHTML = `
      <h1>Your hotkey</h1>
      <p class="muted">Hold this shortcut while you talk, release to type. Click it to change.</p>
      <div class="card"><div class="row"><div class="label">Push-to-talk</div><div class="keycap" id="hk" style="cursor:pointer"></div></div></div>
      <h2>Try it</h2>
      <p class="muted" id="ready">Click in the box, then hold the hotkey and say something.</p>
      <textarea id="try" placeholder="Your words will appear here…"></textarea>
      <p class="muted" style="font-size:12px">Zipscribe will start automatically when you log in. You can turn that off in Settings.</p>`;
    hotkeyRecorder($("#hk"), cfg.hotkey, async (hk) => { cfg.hotkey = hk; await persist(); });
    const upd = async () => {
      const s = await invoke("service_status");
      $("#ready").textContent = s.model_ready
        ? "Click in the box, then hold the hotkey and say something."
        : s.model_error ? "Model problem: " + s.model_error : "Loading the speech model…";
    };
    upd(); page._t = setInterval(upd, 1500);
  },
};

// The clean-up models: the presets plus any the user added from HuggingFace. No external service.
async function refreshCleanupModels() {
  cleanupModels = await invoke("cleanup_model_list");
  if (!cleanupModels.some((m) => m.id === cfg.cleanup_model)) {
    cfg.cleanup_model = (cleanupModels.find((m) => m.is_default) || cleanupModels[0]).id;
  }
}

// Start a preset download or a HuggingFace add. Input errors come back immediately; the rest
// (unsupported model, network) arrive on the cleanup-done event.
async function installCleanup(input) {
  cleanupDlError = null;
  try {
    const id = await invoke("cleanup_install", { repo: input });
    cleanupPrev = cfg.cleanup_model;
    cfg.cleanup_model = id;
    cleanupDl = { id, done: 0, total: 0 };
  } catch (e) { cleanupDlError = String(e); }
  render();
}

function cleanupDlHtml() {
  const pct = cleanupDl.total ? (100 * cleanupDl.done / cleanupDl.total).toFixed(1) : 0;
  return `<div class="bar"><div id="cfill" style="width:${pct}%"></div></div>
    <div class="muted" id="ctxt">Downloading clean-up model… ${fmtBytes(cleanupDl.done)} of ${fmtBytes(cleanupDl.total)}</div>
    <p style="margin-top:8px"><button id="ccancel">Cancel</button></p>`;
}

async function persist() { await invoke("save_config", { cfg }); }

async function refresh() {
  perms = await invoke("permissions");
  speech = await invoke("speech_model");
  const s = STEPS[step];
  if (s === "mic" || s === "access") render();
  else if (s === "model") { if (!dl) render(); else $("#next").disabled = !canContinue(); }
}

$("#back").addEventListener("click", () => { clearInterval(page._t); step--; render(); });
$("#next").addEventListener("click", async () => {
  clearInterval(page._t);
  if (STEPS[step] === "access") { await persist(); }
  if (STEPS[step] === "model") { await persist(); }
  if (STEPS[step] === "cleanup") { await persist(); }
  if (step === STEPS.length - 1) {
    cfg.setup_complete = true;
    await persist();
    try { await invoke("set_login_item", { on: true }); } catch (e) { /* non-fatal; Settings can enable it */ }
    return invoke("close_window");
  }
  step++;
  render();
});

listen("download-progress", (e) => {
  dl = e.payload;
  const fill = $("#fill");
  if (fill && dl.total) {
    fill.style.width = (100 * dl.done / dl.total).toFixed(1) + "%";
    $("#dltext").textContent = `Downloading… ${fmtBytes(dl.done)} of ${fmtBytes(dl.total)}`;
  }
});
listen("download-done", async (e) => {
  dl = null;
  dlError = e.payload.error && e.payload.error !== "cancelled" ? e.payload.error : null;
  speech = await invoke("speech_model");
  if (STEPS[step] === "model") render();
});
// Clean-up model download (presets / arbitrary HF repos): its own panel, shared cancel flag.
listen("cleanup-progress", (e) => {
  cleanupDl = e.payload;
  const fill = $("#cfill");
  if (fill && cleanupDl.total) {
    fill.style.width = (100 * cleanupDl.done / cleanupDl.total).toFixed(1) + "%";
    $("#ctxt").textContent = `Downloading clean-up model… ${fmtBytes(cleanupDl.done)} of ${fmtBytes(cleanupDl.total)}`;
  }
});
listen("cleanup-done", async (e) => {
  cleanupDl = null;
  cleanupDlError = e.payload.error && e.payload.error !== "cancelled" ? e.payload.error : null;
  if (e.payload.error && cleanupPrev) cfg.cleanup_model = cleanupPrev;
  cleanupPrev = null;
  await refreshCleanupModels();
  if (STEPS[step] === "cleanup") render();
  else $("#next").disabled = !canContinue();
});

(async () => {
  cfg = await invoke("get_config");
  perms = await invoke("permissions");
  speech = await invoke("speech_model");
  await refreshCleanupModels();
  render();
  pollTimer = setInterval(refresh, 1000);
})();
</script>
</body>
</html>
